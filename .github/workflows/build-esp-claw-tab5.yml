name: Build ESP-Claw for M5Stack Tab5 (ST7123)

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install esp-bmgr-assist
        run: |
          . $IDF_PATH/export.sh
          pip install esp-bmgr-assist

      - name: Replace board_devices.yaml with ST7123 fixed version
        run: |
          cat > application/edge_agent/boards/m5stack/m5stack_tab5/board_devices.yaml << 'BOARDFILE'
          # Devices Configuration
          devices:
            - name: audio_dac
              chip: es8388
              type: audio_codec
              version: default
              config:
                adc_enabled: false
                dac_enabled: true
                dac_max_channel: 1
                dac_channel_mask: "1"
              peripherals:
                - name: i2s_audio_out
                - name: i2c_master
                  address: 0x20
                  frequency: 400000

            - name: audio_adc
              chip: es7210
              type: audio_codec
              version: default
              config:
                adc_enabled: true
                adc_max_channel: 4
                adc_channel_mask: "0111"
                adc_init_gain: 0
              peripherals:
                - name: i2s_audio_in
                - name: i2c_master
                  address: 0x80
                  frequency: 400000

            - name: fs_sdcard
              type: fs_fat
              sub_type: sdmmc
              version: default
              config:
                sub_config:
                  slot: SDMMC_HOST_SLOT_0
                  frequency: SDMMC_FREQ_HIGHSPEED
                  bus_width: 4
                  pins:
                    clk: 0
                    cmd: 0
                    d0: 0
                    d1: 0
                    d2: 0
                    d3: 0
                    d4: 0
                    d5: 0
                    d6: 0
                    d7: 0
                  ldo_chan_id: 4

            - name: gpio_expander
              chip: pi3ioe
              type: gpio_expander
              version: default
              dependencies:
                espressif/esp_io_expander_pi4ioe5v6408: "*"
              config:
                max_pins: 8
                output_io_mask: [0, 1, 2, 3, 4, 5, 6]
                output_io_level_mask : [0, 1, 1, 0, 1, 1, 1]
                output_io_mode_mask: [0, 0, 0, 0, 0, 0, 0]
                input_io_mask: [7]
              peripherals:
                - name: i2c_master
                  i2c_addr: 0x86

            - name: gpio_expander_2
              chip: pi3ioe
              type: gpio_expander
              version: default
              dependencies:
                espressif/esp_io_expander_pi4ioe5v6408: "*"
              config:
                max_pins: 8
                output_io_mask: [0, 3, 4, 5, 6, 7]
                output_io_level_mask : [1, 1, 0, 0, 0, 0]
                output_io_mode_mask: [0, 0, 0, 0, 0, 0]
              peripherals:
                - name: i2c_master
                  i2c_addr: 0x88

            - name: lcd_brightness
              type: ledc_ctrl
              version: default
              config:
                default_percent: 100
              peripherals:
                - name: ledc_backlight

            - name: display_lcd
              chip: tab5_lcd
              type: display_lcd
              sub_type: dsi
              depends_on:
                - gpio_expander
                - touch_power_ctrl
              dependencies:
                espressif/esp_lcd_ili9881c: "*"
                espressif/esp_lcd_st7123: "*"
              config:
                reset_gpio_num: -1
                rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
                bits_per_pixel: 16
                reset_active_high: 0
                dbi_config:
                  virtual_channel: 0
                  lcd_cmd_bits: 8
                  lcd_param_bits: 8
                dpi_config:
                  virtual_channel: 0
                  dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
                  dpi_clock_freq_mhz: 78
                  in_color_format: LCD_COLOR_FMT_RGB565
                  num_fbs: 2
                  flags:
                    use_dma2d: true
                  video_timing:
                    h_size: 720
                    v_size: 1280
                    hsync_back_porch : 140
                    hsync_pulse_width : 40
                    hsync_front_porch : 40
                    vsync_back_porch : 20
                    vsync_pulse_width : 4
                    vsync_front_porch : 20
              peripherals:
                - name: ldo_mipi
                - name: dsi_display
                - name: gpio_expander
                  i2c_addr: 0x86

            - name: touch_power_ctrl
              type: power_ctrl
              sub_type: gpio
              peripherals:
                - name: gpio_power_touch
                  active_level: 0

            - name: lcd_touch
              chip: tab5_touch
              type: lcd_touch
              sub_type: i2c
              power_ctrl_device: touch_power_ctrl
              depends_on:
                - touch_power_ctrl
                - gpio_expander
              version: default
              dependencies:
                espressif/esp_lcd_touch_gt911: "*"
                espressif/esp_lcd_touch_st7123: "*"
              config:
                io_i2c_config:
                  lcd_cmd_bits: 16
                touch_config:
                  x_max: 720
                  y_max: 1280
              peripherals:
                - name: i2c_master
                  i2c_addr: [0x28, 0xAA]

            - name: camera
              type: camera
              version: default
              sub_type: "csi"
              config:
                csi_config:
                  reset_io: -1
                  pwdn_io: -1
                  dont_init_ldo: true
              peripherals:
                - name: "i2c_master"
                  frequency: 100000
                - name: ldo_mipi
          BOARDFILE

      - name: Select board (M5Stack Tab5)
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh
          idf.py bmgr -c ./boards -b m5stack_tab5

      - name: Build firmware
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Show firmware size
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh
          idf.py size

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-m5stack-tab5-st7123-${{ github.sha }}
          path: |
            application/edge_agent/build/bootloader/bootloader.bin
            application/edge_agent/build/partition_table/partition-table.bin
            application/edge_agent/build/*.bin
            application/edge_agent/build/*.elf
            application/edge_agent/build/flasher_args.json
          if-no-files-found: error
          retention-days: 30