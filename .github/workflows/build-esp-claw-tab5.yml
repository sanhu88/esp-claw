name: Build ESP-Claw for M5Stack Tab5

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # ESP-IDF v5.5.4 官方镜像
      # 如果该精确标签不存在，可改为 v5.5 或 release-v5.5
      image: espressif/idf:v5.5.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install esp-bmgr-assist
        run: |
          . $IDF_PATH/export.sh
          pip install esp-bmgr-assist

      - name: Select board (M5Stack Tab5)
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh
          idf.py bmgr -c ./boards -b m5stack_tab5

      - name: Build firmware
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Show firmware size
        working-directory: application/edge_agent
        run: |
          . $IDF_PATH/export.sh
          idf.py size

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp-claw-m5stack-tab5-${{ github.sha }}
          path: |
            application/edge_agent/build/bootloader/bootloader.bin
            application/edge_agent/build/partition_table/partition-table.bin
            application/edge_agent/build/*.bin
            application/edge_agent/build/*.elf
            application/edge_agent/build/flasher_args.json
          if-no-files-found: error
          retention-days: 30